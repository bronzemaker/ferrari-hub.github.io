<head>

    <link id ='overide-link' rel="stylesheet" href="/css/dos.css">
    <script>
        // Check for a saved theme on page load
        const savedTheme = localStorage.getItem('selected-theme');
        if (savedTheme) {
            if (savedTheme === '/css/style.css') {

                document.getElementById('overide-link').disabled = true;
            } else {
                document.getElementById('overide-link').disabled = false;
            }
        } else {
            // If no theme is saved, default to the original style
            document.getElementById('overide-link').disabled = true;
        }
    </script>
